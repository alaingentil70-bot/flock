/* ---------- growth, FCR ---------- */
const ROSS=[[0,44],[7,213],[14,533],[21,1012],[28,1616],[35,2296],[42,2998],[45,3295]];
function targetAt(day,M){const tgt=num(M.st.targetWeight)||2;const end=M.cycleDays;const r=d=>{d=Math.max(0,Math.min(45,d));for(let i=1;i<ROSS.length;i++){if(d<=ROSS[i][0]){const [a,av]=ROSS[i-1],[b,bv]=ROSS[i];return av+(bv-av)*(d-a)/(b-a)}}return ROSS[ROSS.length-1][1]};
  const scale=(tgt*1000)/r(Math.min(45,end));return r(day*Math.min(45,end)/end)*scale/1000}
function growthChart(M){
  const W=640,H=250,L=40,R=16,T=16,B=30;const base=H-B;
  const maxW=Math.max(num(M.st.targetWeight)||2,...M.weighins.map(w=>w.avg))*1.08;
  const x=d=>L+d/M.cycleDays*(W-L-R), y=v=>T+(1-v/maxW)*(H-T-B);
  let tp="";for(let d=0;d<=M.cycleDays;d++)tp+=(d?"L":"M")+x(d).toFixed(1)+","+y(targetAt(d,M)).toFixed(1);
  const tArea=`${tp}L${x(M.cycleDays).toFixed(1)},${base} L${x(0).toFixed(1)},${base} Z`;
  let gp="";M.weighins.forEach((w,i)=>{gp+=(i?"L":"M")+x(w.day).toFixed(1)+","+y(w.avg).toFixed(1)});
  let yt="";const st=maxW>2.4?0.5:0.25;for(let v=0;v<=maxW;v+=st)yt+=`<line class="gridln soft" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v.toFixed(v%1?2:0)}</text>`;
  let xt="";[0,7,14,21,28,35,42].filter(d=>d<=M.cycleDays).concat([M.cycleDays]).forEach(d=>xt+=`<text x="${x(d)}" y="${H-10}" text-anchor="middle">${d}</text>`);
  const dots=M.weighins.map(w=>`<circle class="gdot" cx="${x(w.day)}" cy="${y(w.avg)}" r="4.5"/>`).join("");
  const hits=M.weighins.map(w=>{const t=targetAt(w.day,M);return `<rect class="hit" x="${(x(w.day)-12).toFixed(1)}" y="${T}" width="24" height="${base-T}" data-cx="${x(w.day).toFixed(1)}" data-cy="${y(w.avg).toFixed(1)},${y(t).toFixed(1)}" data-tip="${esc(`<b>Day ${w.day}</b> · ${fd(parse(w.date),1)}<br>${tk("Average",w.avg.toFixed(2)+" kg")} (${w.birds} birds)<br>${tk("Target path",t.toFixed(2)+" kg")} · ${w.avg>=t?'<b style="color:var(--good)">on or above</b>':'<b style="color:var(--warn)">behind by '+(t-w.avg).toFixed(2)+" kg</b>"}${w.fcr?`<br>${tk("FCR",w.fcr.toFixed(2))}`:""}`)}"/>`}).join("");
  const last=M.weighins[M.weighins.length-1];
  const tag=last?`<rect class="tag" x="${(x(last.day)-17).toFixed(1)}" y="${(y(last.avg)-24).toFixed(1)}" width="34" height="16" rx="3"/><text class="tagt" x="${x(last.day).toFixed(1)}" y="${(y(last.avg)-12).toFixed(1)}" text-anchor="middle">${last.avg.toFixed(2)}</text>`:"";
  const today=M.dayNow>=0&&M.dayNow<=M.cycleDays?`<line class="todayln" x1="${x(M.dayNow)}" x2="${x(M.dayNow)}" y1="${T}" y2="${base}" stroke-opacity=".55"/>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average weight against the target path"><defs><linearGradient id="gGrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".12"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${yt}<path class="band" d="${tArea}" fill="url(#gGrow)"/><path class="proj" d="${tp}"/>${today}<path class="series" d="${gp}"/>${dots}${tag}<line class="axis" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>${xt}<text x="${L}" y="${H}" class="lab" style="font-size:10px">day of cycle · kg per bird</text>${xhairG(T,base,3)}${hits}</svg>
  <div class="legend"><span><i class="line" style="background:var(--ink)"></i>Your weigh-ins</span><span><i class="dash"></i>Target path to ${num(M.st.targetWeight)||2} kg</span><span><i class="line" style="background:var(--accent)"></i>Today</span></div>`;
}

// Cumulative cost vs the flock's sale value as it grows — the crossing is the day the batch turns a profit.
function breakevenChart(M){
  const W=640,H=260,L=52,R=16,T=16,B=32,base=H-B;
  const cut=Math.min(Math.max(M.dayNow??0,0),M.cycleDays);
  const dayOf=ms2=>{const dm=parse(ms2);const dd=dm!=null&&M.start!=null?Math.floor((dm-M.start)/DAY)+1:1;return Math.min(Math.max(dd,1),M.cycleDays)};
  const spendBy=new Array(M.cycleDays+2).fill(0);
  spendBy[1]+=M.chickCost+M.coop+M.other;
  S.feed.forEach(f=>spendBy[dayOf(f.date)]+=num(f.bags)*num(f.costPerBag));
  S.meds.forEach(m=>spendBy[dayOf(m.dateBought)]+=num(m.cost));
  S.expenses.forEach(e=>spendBy[dayOf(e.date)]+=num(e.amount));
  const cum=[];let r=0;for(let d=0;d<=M.cycleDays;d++){r+=d>=1?spendBy[d]:0;cum[d]=r}
  const aliveAt=d=>d<=cut?(M.days[Math.max(0,d-1)]?.endAlive??M.flock):M.alive;
  const value=d=>aliveAt(d)*targetAt(d,M)*M.price;
  const saleVal=value(M.cycleDays),maxCost=cum[M.cycleDays];
  const maxY=Math.max(saleVal,maxCost)*1.08||1;
  const x=d=>L+d/M.cycleDays*(W-L-R), y=v=>T+(1-v/maxY)*(H-T-B);
  // crossing day (first day value>=cost)
  let cross=null;for(let d=1;d<=M.cycleDays;d++){if(value(d)>=cum[d]){cross=d;break}}
  let cp="",cpP="",vp="",vpP="";
  for(let d=0;d<=M.cycleDays;d++){const cmd=(d?"L":"M")+x(d).toFixed(1)+","+y(cum[d]).toFixed(1);if(d<=cut)cp+=cmd;else{if(!cpP)cpP="M"+x(Math.min(cut,d)).toFixed(1)+","+y(cum[Math.min(cut,M.cycleDays)]).toFixed(1);cpP+="L"+x(d).toFixed(1)+","+y(cum[d]).toFixed(1)}}
  for(let d=0;d<=M.cycleDays;d++){const vmd=(d?"L":"M")+x(d).toFixed(1)+","+y(value(d)).toFixed(1);if(d<=cut)vp+=vmd;else{if(!vpP)vpP="M"+x(cut).toFixed(1)+","+y(value(cut)).toFixed(1);vpP+="L"+x(d).toFixed(1)+","+y(value(d)).toFixed(1)}}
  let yt="";const stp=maxY/4;for(let i=0;i<=4;i++){const v=stp*i;yt+=`<line class="gridln soft" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v>=1000?k(Math.round(v/1000))+"k":k(v)}</text>`}
  let xt="";[1,8,15,22,29,36,M.cycleDays].forEach(d=>xt+=`<text x="${x(d)}" y="${H-10}" text-anchor="middle">${d}</text>`);
  const crossMark=cross!=null?`<line class="ref" x1="${x(cross)}" x2="${x(cross)}" y1="${T}" y2="${base}"/><circle cx="${x(cross).toFixed(1)}" cy="${y(value(cross)).toFixed(1)}" r="4" fill="var(--good)" stroke="var(--surface)" stroke-width="2"/><text x="${x(cross).toFixed(1)}" y="${T+2}" text-anchor="middle" class="lab" style="fill:var(--good);font-weight:600">break-even ≈ day ${cross}</text>`:"";
  const today=cut>=1&&cut<=M.cycleDays?`<line class="todayln" x1="${x(cut)}" x2="${x(cut)}" y1="${T}" y2="${base}" stroke-opacity=".55"/>`:"";
  const step=(W-L-R)/M.cycleDays;
  const hits=[];for(let d=1;d<=M.cycleDays;d++){const prof=value(d)-cum[d];hits.push(`<rect class="hit" x="${(x(d)-step/2).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${base-T}" data-cx="${x(d).toFixed(1)}" data-cy="${y(cum[d]).toFixed(1)},${y(value(d)).toFixed(1)}" data-tip="${esc(`<b>Day ${d}</b>${d<=cut?"":" (projected)"}<br>${tk("Cost so far",k(cum[d])+" RWF")}<br>${tk("Flock value",k(value(d))+" RWF")}<br>${tk(prof>=0?"Ahead by":"Short by",k(Math.abs(prof))+" RWF")}`)}"/>`)}
  return `<div class="tw"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:560px" role="img" aria-label="Cost against flock value by day"><defs><linearGradient id="gBE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--good)" stop-opacity=".13"/><stop offset="1" stop-color="var(--good)" stop-opacity="0"/></linearGradient></defs>${yt}<path class="band" d="${vp}L${x(cut).toFixed(1)},${base} L${x(0).toFixed(1)},${base} Z" fill="url(#gBE)"/>${crossMark}${today}<path class="series" style="stroke:var(--good)" d="${vp}"/><path class="series" style="stroke:var(--good);stroke-dasharray:4 4" d="${vpP}"/><path class="series" style="stroke:var(--accent)" d="${cp}"/><path class="series" style="stroke:var(--accent);stroke-dasharray:4 4" d="${cpP}"/><line class="axis" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>${xt}<text x="${L}" y="${H}" class="lab" style="font-size:10px">day of cycle · RWF</text>${xhairG(T,base,2)}${hits.join("")}</svg></div>
  <div class="legend"><span><i class="line" style="background:var(--accent)"></i>Money spent (cost)</span><span><i class="line" style="background:var(--good)"></i>Flock value if sold</span><span><i class="round" style="background:var(--good)"></i>Break-even day</span><span><i class="dash"></i>Projected to sale</span></div>`;
}

const CAUSE_COL=["var(--crit)","var(--warn)","var(--info)","var(--supp)","var(--accent)","var(--ink2)","var(--good)","var(--anti)"];
// Deaths grouped by week, stacked by recorded cause.
function deathsByWeekChart(M){
  if(!M.deaths)return `<p class="muted">No deaths recorded. Log the cause of any death in the daily log and it will show here.</p>`;
  const weeks=Math.ceil(M.cycleDays/7);
  const data=[];for(let w=1;w<=weeks;w++)data.push({w,byCause:{},total:0});
  M.days.forEach(d=>{if(d.deaths){const w=Math.ceil(d.day/7);const c=(d.rec&&d.rec.cause)||"Not recorded";const o=data[w-1];o.byCause[c]=(o.byCause[c]||0)+d.deaths;o.total+=d.deaths}});
  const causeList=[...new Set(M.days.filter(d=>d.deaths).map(d=>(d.rec&&d.rec.cause)||"Not recorded"))];
  const col=c=>c==="Not recorded"?"var(--muted)":CAUSE_COL[Math.max(0,causeList.filter(x=>x!=="Not recorded").indexOf(c))%CAUSE_COL.length];
  const W=640,H=210,L=28,R=12,T=14,B=38,base=H-B;
  const maxT=Math.max(1,...data.map(d=>d.total));
  const bw=(W-L-R)/weeks,barW=Math.min(42,bw*0.6);
  const x=w=>L+(w-0.5)*bw, y=v=>T+(1-v/maxT)*(H-T-B);
  let yt="";for(let v=0;v<=maxT;v++){if(maxT>6&&v%2)continue;yt+=`<line class="gridln soft" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`}
  let bars="";data.forEach(d=>{let yy=base;const parts=Object.entries(d.byCause).sort((a,b)=>b[1]-a[1]);
    parts.forEach(([c,n])=>{const h=(base-y(n))-(base-y(0));const hh=n/maxT*(H-T-B);yy-=hh;bars+=`<rect x="${(x(d.w)-barW/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${barW.toFixed(1)}" height="${hh.toFixed(1)}" fill="${col(c)}" stroke="var(--surface)" stroke-width="1"/>`});
    if(d.total)bars+=`<text class="barlab" x="${x(d.w).toFixed(1)}" y="${(yy-5).toFixed(1)}" text-anchor="middle">${d.total}</text>`;
    const tip=d.total?parts.map(([c,n])=>`${c}: ${n}`).join("<br>"):"No deaths";
    bars+=`<rect class="hit" x="${(x(d.w)-bw/2).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${base-T}" data-tip="${esc(`<b>Week ${d.w}</b> · days ${(d.w-1)*7+1}–${Math.min(d.w*7,M.cycleDays)}<br>${tip}`)}"/>`;
  });
  let xt="";data.forEach(d=>xt+=`<text x="${x(d.w).toFixed(1)}" y="${H-20}" text-anchor="middle">wk ${d.w}</text>`);
  const legend=causeList.map(c=>`<span><i class="sq" style="background:${col(c)}"></i>${esc(c)}</span>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Deaths by week and cause">${yt}${bars}<line class="axis" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>${xt}</svg>
  <div class="legend">${legend}</div>`;
}
const TEMP_BANDS=[[32,35],[30,32],[27,29],[24,26],[21,24],[21,24],[21,24]];
function tempBandChart(M){
  const pts=M.days.filter(d=>d.rec&&d.rec.temp!=null&&d.rec.temp!=="").map(d=>({day:d.day,t:Number(d.rec.temp)})).filter(p=>Number.isFinite(p.t));
  const W=640,H=220,L=36,R=14,T=14,B=34,base=H-B;
  const lo=18,hi=37;
  const x=d=>L+(d-1)/(M.cycleDays-1)*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const cut=Math.min(Math.max(M.dayNow??0,1),M.cycleDays);
  // target band polygon: top edge left-to-right, bottom edge right-to-left
  let bt="",bb=[];for(let d=1;d<=M.cycleDays;d++){const w=Math.ceil(d/7);const[bl,bh]=TEMP_BANDS[Math.min(w-1,TEMP_BANDS.length-1)];bt+=(d===1?"M":"L")+x(d).toFixed(1)+","+y(bh).toFixed(1);bb.push([x(d),y(bl)])}
  const bandPath=bt+bb.reverse().map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("")+" Z";
  let yt="";[20,24,28,32,36].forEach(v=>yt+=`<line class="gridln soft" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`);
  let xt="";[1,8,15,22,29,36,M.cycleDays].forEach(d=>xt+=`<text x="${x(d).toFixed(1)}" y="${H-18}" text-anchor="middle">${d}</text>`);
  let lp="";pts.forEach((p,i)=>lp+=(i?"L":"M")+x(p.day).toFixed(1)+","+y(p.t).toFixed(1));
  const dots=pts.map(p=>{const w=Math.ceil(p.day/7);const[bl,bh]=TEMP_BANDS[Math.min(w-1,TEMP_BANDS.length-1)];const inb=p.t>=bl&&p.t<=bh;return `<circle cx="${x(p.day).toFixed(1)}" cy="${y(p.t).toFixed(1)}" r="3.5" fill="var(${inb?"--good":"--crit"})" stroke="var(--surface)" stroke-width="1.5"/><rect class="hit" x="${(x(p.day)-8).toFixed(1)}" y="${T}" width="16" height="${base-T}" data-tip="${esc(`<b>Day ${p.day}</b><br>${tk("Room heat",p.t+" °C")}<br>${tk("Aim",bl+"–"+bh+" °C")} · ${inb?'<b style="color:var(--good)">in range</b>':p.t<bl?'<b style="color:var(--crit)">too cold</b>':'<b style="color:var(--crit)">too hot</b>'}`)}"/>`}).join("");
  const today=cut>=1&&cut<=M.cycleDays?`<line class="todayln" x1="${x(cut)}" x2="${x(cut)}" y1="${T}" y2="${base}" stroke-opacity=".5"/>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Room temperature against the brooding target band">${yt}<path d="${bandPath}" fill="var(--good)" opacity=".13"/>${today}<path class="series" style="stroke:var(--ink)" d="${lp}"/>${dots}<line class="axis" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>${xt}<text x="${L}" y="${H}" class="lab" style="font-size:10px">day of cycle · °C</text></svg>
  <div class="legend"><span><i class="sq" style="background:var(--good);opacity:.4"></i>Target heat band</span><span><i class="round" style="background:var(--good)"></i>In range</span><span><i class="round" style="background:var(--crit)"></i>Out of range</span></div>
  ${pts.length?"":`<p class="muted" style="font-size:.8rem;margin:8px 0 0">No room temperatures logged yet. Add the reading when you log a day and it will plot against the target band.</p>`}`;
}
// Grouped bars: cost vs revenue per cycle, for the year view.
function cycleCompareChart(rows){
  if(!rows.length)return `<p class="muted">No cycles to compare yet. Close this cycle when it is sold, or add past cycles.</p>`;
  const W=640,H=250,L=46,R=12,T=16,B=46,base=H-B;
  const maxV=Math.max(1,...rows.map(r=>Math.max(r.cost,r.revenue)))*1.12;
  const n=rows.length,gw=(W-L-R)/n;
  const y=v=>T+(1-v/maxV)*(H-T-B);
  const bw=Math.min(30,gw*0.3);
  let yt="";for(let i=0;i<=4;i++){const v=maxV/4*i;yt+=`<line class="gridln soft" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v>=1000?k(Math.round(v/1000))+"k":k(v)}</text>`}
  let bars="";rows.forEach((r,i)=>{const cx=L+(i+0.5)*gw;const profit=r.revenue-r.cost;
    bars+=`<rect x="${(cx-bw-2).toFixed(1)}" y="${y(r.cost).toFixed(1)}" width="${bw.toFixed(1)}" height="${(base-y(r.cost)).toFixed(1)}" rx="2" fill="var(--accent)"/>`;
    bars+=`<rect x="${(cx+2).toFixed(1)}" y="${y(r.revenue).toFixed(1)}" width="${bw.toFixed(1)}" height="${(base-y(r.revenue)).toFixed(1)}" rx="2" fill="var(--good)"/>`;
    const lbl=String(r.cycle).replace(/^Cycle /,"C");
    const topY=Math.min(y(r.cost),y(r.revenue))-6;
    bars+=`<text class="barlab" x="${cx.toFixed(1)}" y="${topY.toFixed(1)}" text-anchor="middle" style="fill:var(${profit<0?"--crit":"--good"});font-weight:700">${k(profit)}</text>`;
    bars+=`<text x="${cx.toFixed(1)}" y="${H-12}" text-anchor="middle">${esc(lbl)}</text>`;
    bars+=`<rect class="hit" x="${(cx-gw/2).toFixed(1)}" y="${T}" width="${gw.toFixed(1)}" height="${base-T}" data-tip="${esc(`<b>${r.cycle}</b>${r.live?" (projected)":""}<br>${tk("Cost",k(r.cost)+" RWF")}<br>${tk("Revenue",k(r.revenue)+" RWF")}<br>${tk(profit<0?"Loss":"Profit",k(profit)+" RWF")}`)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost and revenue by cycle">${yt}${bars}<line class="axis" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/><text x="${L}" y="${H}" class="lab" style="font-size:10px">profit shown above each pair · RWF</text></svg>
  <div class="legend"><span><i class="sq" style="background:var(--accent)"></i>Cost</span><span><i class="sq" style="background:var(--good)"></i>Revenue</span></div>`;
}
function vGrowth(M){
  if(!S.setup)return emptyState();
  const last=M.weighins[M.weighins.length-1];
  const rows=[...M.weighins].reverse().map(w=>{const t=targetAt(w.day,M);return `<tr class="${canWrite?"click":""}" data-edit="weighins" data-id="${esc(w._id)}"><td class="mono">${fd(parse(w.date),1)}</td><td class="n">${w.day}</td><td class="n">${w.birds}</td><td class="n">${num(w.totalKg).toFixed(2)}</td><td class="n"><b>${w.avg.toFixed(2)}</b></td><td class="n">${t.toFixed(2)}</td><td class="n">${w.feedLeftKg!=null&&w.feedLeftKg!==""?k(num(w.feedLeftKg)):"—"}</td><td class="n">${w.fcr?w.fcr.toFixed(2):"—"}</td><td class="note">${esc(w.notes||"")}</td></tr>`}).join("");
  const fcrS=M.fcr==null?"neutral":M.fcr<=1.8?"good":M.fcr<=2.2?"warn":"crit";
  return `
  <div class="vhead"><div><h2>Growth & feed conversion</h2><p>Once a week, weigh 5–10 birds picked at random and enter their total weight. Note how much feed is left in store the same day, and the site works out the feed conversion ratio (FCR): kilograms of feed eaten for each kilogram of live weight gained. Lower is better.</p></div><span class="spacer"></span>${canWrite?`<button class="btn pri" type="button" data-add="weighins">Add a weigh-in</button>`:""}</div>
  <div class="hero">
    <div><div class="eyebrow">Latest average weight</div><div class="big">${last?last.avg.toFixed(2):"—"}<small> kg</small></div><div class="sub">${last?`Day ${last.day} · target path ${targetAt(last.day,M).toFixed(2)} kg`:"No weigh-ins yet"}</div></div>
    <div><div class="eyebrow">Feed conversion (FCR)</div><div class="mid">${M.fcr!=null?M.fcr.toFixed(2):"—"}</div><div class="sub">${M.fcr!=null?`<span class="chip ${fcrS}">${M.fcrFinal?"Final":"Latest"}</span> kg feed per kg gained`:"Needs a weigh-in with feed left in store"}</div></div>
    <div><div class="eyebrow">Cost per kg live weight</div><div class="mid">${M.costPerKg?k(M.costPerKg):"—"}</div><div class="sub">RWF${M.costPerKg?` · you sell at ${k(M.price)} RWF/kg`:""}</div></div>
    <div><div class="eyebrow">Efficiency factor (EPEF)</div><div class="mid">${M.epef?Math.round(M.epef):"—"}</div><div class="sub">survival × weight ÷ (age × FCR) × 100</div></div>
  </div>
  <section class="panel"><h3>Weight against the target path</h3>${M.weighins.length?growthChart(M):`<div class="empty">No weigh-ins yet. Weigh 5–10 birds in a bucket or bag on a kitchen or hanging scale, take away the bucket's weight, and add it here.</div>`}
    <p class="muted" style="font-size:.78rem;margin:10px 0 0">The target path follows the growth curve shape published for Ross 308 broilers, scaled down so it ends at your target of ${num(M.st.targetWeight)||2} kg on day ${M.cycleDays}. Under ideal commercial conditions that breed reaches about 3.3 kg by day 45.</p></section>
  <section class="panel"><h3>Weigh-ins</h3><div class="tw"><table><thead><tr><th>Date</th><th class="n">Day</th><th class="n">Birds weighed</th><th class="n">Total kg</th><th class="n">Average kg</th><th class="n">Target kg</th><th class="n">Feed left (kg)</th><th class="n">FCR</th><th>Notes</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="muted">No weigh-ins yet.</td></tr>'}</tbody></table></div>
  <p class="muted" style="font-size:.78rem;margin:10px 0 0">FCR = feed used ÷ (live weight now + weight already sold − chick weight at arrival). Feed used = feed bought up to that day − feed left in store. Chicks are counted at about 44 g each on arrival.</p></section>`;
}

/* ---------- expenses ---------- */
const EXP_CATS=["Labour","Transport","Heating and charcoal","Bedding","Cleaning and disinfection","Water and electricity","Vet visits","Equipment and repairs","Other"];
function vExpenses(M){
  if(!S.setup)return emptyState();
  const rows=[...S.expenses].sort((a,b)=>(parse(b.date)??0)-(parse(a.date)??0));

  </tbody><tfoot><tr class="tot"><td colspan="4">Total</td><td class="n">${k(M.expTotal)}</td></tr></tfoot></table></div></section>
  <section class="panel"><h3>By category</h3><div class="hbar">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<span>${esc(c)}</span><span class="tr"><i style="width:${(v/mx*100).toFixed(1)}%"></i></span><span class="v">${k(v)}</span>`).join("")||'<span class="muted">Nothing yet.</span>'}</div>
  <div class="kv" style="margin-top:14px"><div>Expenses per live bird</div><div>${M.alive?k(M.expTotal/M.alive):"—"} RWF</div><div>Share of total cost</div><div>${M.totalCost?pct(M.expTotal/M.totalCost):"—"}</div></div></section></div>`;
}

/* ---------- sales & buyers ---------- */
function vSales(M){
  if(!S.setup)return emptyState();
  const rows=[...S.sales].sort((a,b)=>(parse(b.date)??0)-(parse(a.date)??0));
  const agg={};S.sales.forEach(s=>{const n=(s.buyer||"Walk-in").trim()||"Walk-in";const a=agg[n]=agg[n]||{birds:0,kg:0,amt:0,paid:0,n:0};a.birds+=num(s.birds);a.kg+=num(s.kg);a.amt+=saleAmt(s);a.paid+=num(s.paid);a.n++});
  S.buyers.forEach(b=>{agg[b.name]=agg[b.name]||{birds:0,kg:0,amt:0,paid:0,n:0}});
  const buyerRows=Object.entries(agg).sort((a,b)=>b[1].amt-a[1].amt).map(([n,a])=>{const b=S.buyers.find(x=>x.name===n);const owed=a.amt-a.paid;return `<tr class="${canWrite&&b?"click":""}" ${b?`data-edit="buyers" data-id="${esc(b._id)}"`:""}><td><b>${esc(n)}</b>${b&&(b.phone||b.place)?`<div class="muted" style="font-size:.76rem">${esc([b.phone,b.place].filter(Boolean).join(" · "))}</div>`:""}${b?.notes?`<div class="muted" style="font-size:.76rem">${esc(b.notes)}</div>`:""}</td><td class="n">${a.n}</td><td class="n">${a.birds}</td><td class="n">${a.kg?a.kg.toFixed(1):"—"}</td><td class="n">${k(a.amt)}</td><td class="n">${owed>0?`<span class="dz">${k(owed)}</span>`:"0"}</td></tr>`}).join("");
  return `
  <div class="vhead"><div><h2>Sales & buyers</h2><p>Record each sale as it happens: who bought, how many birds, the total live weight, the price and what has been paid. The money page then uses what you actually earned, and anything still owed shows here.</p></div><span class="spacer"></span>${canWrite?`<button class="btn" type="button" data-add="buyers">Add buyer</button><button class="btn pri" type="button" data-add="sales">Record a sale</button>`:""}</div>
  <div class="hero">

function dataChecks(M){
  const checks=[];
  const ms=S.meds.find(m=>/multi.?sol|multi.?aminovet|aminovet/i.test(m.name||""));
  if(ms&&num(ms.rateMin)>=0.9)checks.push([`The packet labelled "${esc(ms.name)}"`,`If your packet is <b>Multi-Aminovet</b>, the label reads 100 g per 200 L, which is <b>0.5 g per litre</b> for 3–5 days, not the 1 g/L set here. Check the packet and fix the rate in the medicine list.`,"health","Open Health & medicine"]);
  const enro=M.doses.find(d=>/enrosol/i.test(d.product||"")&&(num(d.timesPerDay)||1)===1);
  if(enro)checks.push(["Enrosol-S: how many times a day?",`Your earlier spreadsheet said Enrosol-S was given <b>5 times a day</b>, but a dose here is set to <b>1</b>. Confirm which is right and edit the dose if it is wrong.`,"health","Open Health & medicine"]);
  const noPrice=S.materials.filter(m=>/(drinker|syringe)/i.test(m.name||"")&&!num(m.unitCost));
  if(noPrice.length)checks.push(["Some equipment has no price yet",`${noPrice.map(m=>"<b>"+esc(m.name)+"</b>").join(", ")} ${noPrice.length===1?"has":"have"} no price. Add what you paid so the cost totals are complete.`,"materials","Open Materials"]);
  checks.push(["Which sale price should the plan use?",`Setup uses <b>${k(num(M.st.salePrice))} RWF/kg</b>. Some earlier estimates used 4,800. Set the figure you really expect so the profit numbers match.`,null,null]);
  if(!checks.length)return"";
  return `<section class="panel"><h3>Things to double-check <span class="chip warn">${checks.length}</span></h3>

/* ---------- start a new cycle ---------- */
// Saves the whole current cycle into the "archive" collection (one doc, read back by archStore),
// adds its results to the Year view, then clears the cycle's own records and resets Setup.
// Kept for the next cycle: materials, buyers, undone reminders, medicine list (cost set to 0,
// because it was already counted in the closed cycle), and medicine/material photos.
function nextCycleNo(){return Math.max(0,...L.cycles.map(c=>num(c.cycle)),...L.archive.map(a=>num(a.cycle)))+1}
function curCycleNo(){const c=L.cycles.find(x=>x.start===L.setup?.startDate);return c?num(c.cycle):nextCycleNo()}
async function startNewCycle(){
  const M=derive();const st=L.setup;if(!st)return;
  const n=curCycleNo(), name=st.cycleName||("Cycle "+n);
  const nv={name:$("#nc_name").value.trim()||("Cycle "+(n+1)),start:$("#nc_start").value,chicks:$("#nc_chicks").value,bonus:$("#nc_bonus").value,price:$("#nc_price").value};
  if(!parse(nv.start)){toast("Enter the date the new chicks arrive.");return}
  if(nv.start<=st.startDate){toast("The new cycle must start after "+fd(parse(st.startDate),1)+".");return}
  const arch={cycle:n,name,start:st.startDate,closedOn:iso(todayMs()),setup:{...st},daily:L.daily,checks:L.checks,
    summary:{birds:M.flock,deaths:M.deaths,sold:M.soldBirds,soldKg:M.soldKg,cost:M.totalCost,revenue:M.revenue,profit:M.profit,salesAmt:M.salesAmt,owed:M.owed}};
  CYCLE_COLS.forEach(c=>arch[c]=L[c].map(x=>({...x})));
  const btn=$("#nc_go");if(btn){btn.disabled=true;btn.textContent="Saving "+name+"…"}
  try{
    // 1. save the old cycle first; nothing is deleted unless this works
    await db.collection("archive").doc("cycle-"+n).set(arch);
    const ex=L.cycles.find(c=>c.start===st.startDate);
    await db.collection("cycles").doc(ex?ex._id:"cycle-"+n).set({cycle:n,start:st.startDate,chicks:M.chicks,bonus:M.bonus,deaths:M.deaths,cost:M.totalCost,revenue:M.revenue,archived:true,notes:(num(st.actualWeight)||M.soldKg?"Final":"Projected")+" · "+M.soldBirds+" birds sold"});
    // 2. clear this cycle's own records
    const del=[];
    Object.keys(L.daily).forEach(id=>del.push(db.collection("daily").doc(id).delete()));
    Object.keys(L.checks).forEach(id=>del.push(db.collection("checks").doc(id).delete()));
    ["feed","doses","expenses","sales","weighins","vaccines"].forEach(c=>L[c].forEach(r=>del.push(db.collection(c).doc(r._id).delete())));
    L.todos.filter(t=>t.done).forEach(r=>del.push(db.collection("todos").doc(r._id).delete()));
    L.photos.filter(p=>p.kind==="day"||p.kind==="other").forEach(r=>del.push(db.collection("photos").doc(r._id).delete()));
    await Promise.all(del);
    // 3. medicine list carries over; its cost stays with the closed cycle

 ["How they look",[["All normal","ok"],["Eating well","ok"],["Drinking well","ok"],["Active","ok"],["Droppings normal","ok"]]],

    try{await db.collection("daily").doc(dayId(d)).set(rec);quick=null;
      // saving the log also ticks "deaths logged" on today's checklist
      const di=iso(todayMs());const items={...(S.checks[di]?.items||{}),deaths:true};db.collection("checks").doc(di).set({date:di,items}).catch(()=>{});
      render();toast("Day "+d+" saved")}catch(err){writeFail(err)}}
  if(act==="saveSetup"){const out={...(S.setup||{})};delete out._id;["cycleName","startDate","notes"].forEach(k2=>out[k2]=($("#su_"+k2)?.value||"").trim());["cycleDays","chicks","bonusChicks","pricePerChick","targetWeight","actualWeight","salePrice","priceLow","priceHigh","otherCosts","coopShare"].forEach(k2=>{const v=$("#su_"+k2).value;out[k2]=v===""?null:Number(v)});
    if(!parse(out.startDate)){toast("Enter a start date first.");return}
    try{await db.doc("farm/setup").set(out);scen=null;toast("Setup saved")}catch(err){writeFail(err)}}
  if(act==="closeCycle"){const M=derive();const n=(S.cycles.reduce((a,c)=>Math.max(a,num(c.cycle)),0)||0)+1;const exist=S.cycles.find(c=>c.start===S.setup.startDate);
    const data={cycle:exist?num(exist.cycle):n,start:S.setup.startDate,chicks:M.chicks,bonus:M.bonus,deaths:M.deaths,cost:M.totalCost,revenue:M.revenue,notes:(num(M.st.actualWeight)?"Final":"Projected")+" at "+M.weight+" kg × "+M.price+" RWF/kg"};
    try{await db.collection("cycles").doc(exist?exist._id:"cycle-"+n).set(data);toast("Cycle results saved")}catch(err){writeFail(err)}}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(viewArch&&(t.dataset.check||t.dataset.todo||t.dataset.moveph||t.dataset.cap||t.id==="filePick"))return;
  if(t.id==="filePick"&&pending&&t.files.length){const tg=pending;pending=null;await uploadFiles([...t.files],tg);return}
  if(t.dataset.moveph&&db){const p=S.photos.find(x=>x._id===t.dataset.moveph);const M=derive();const n=Math.round(num(t.value));if(p&&n>=1&&n<=M.cycleDays&&n!==num(p.day)){const o={...p};delete o._id;o.day=n;o.date=iso(M.start+(n-1)*DAY);try{await db.collection("photos").doc(p._id).set(o);toast("Moved to day "+n)}catch(err){writeFail(err)}}return}
  if(t.dataset.cap&&db){const p=S.photos.find(x=>x._id===t.dataset.cap);if(p){const o={...p};delete o._id;o.caption=t.value.trim();try{await db.collection("photos").doc(p._id).set(o)}catch(err){writeFail(err)}}return}
  if(t.dataset.check&&db){const d=iso(todayMs());const items={...(S.checks[d]?.items||{})};items[t.dataset.check]=t.checked;try{await db.collection("checks").doc(d).set({date:d,items})}catch(err){writeFail(err)}}
  if(t.dataset.todo&&db){const r=S.todos.find(x=>x._id===t.dataset.todo);if(r){const o={...r};delete o._id;o.done=t.checked;try{await db.collection("todos").doc(r._id).set(o)}catch(err){writeFail(err)}}}
  if(t.id==="donly"){dailyFilter.deathsOnly=t.checked;render()}
  if(t.id==="cStage"){calc.stage=t.value;render()}
  if(t.id==="sExtra"&&scen){scen.extra=Math.max(0,num(t.value));render()}
  const map2={sBirds:"birds",sWeight:"weight",sPrice:"price",sBags:"bags"};
  if(map2[t.id]&&scen){scen[map2[t.id]]=Number(t.value);render()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="dq"){dailyFilter.q=t.value;render()}
  if((t.id==="qNotes"||t.id==="q_temp")&&$("#qDeaths"))quick=readQuick();
  if(t.id&&t.id.startsWith("nc_"))ncDraft[t.id]=t.value;
  if(t.id==="cL"){const v=num(t.value);if(v>0){calc.litres=v;render()}}
  const map={sBirds:"birds",sWeight:"weight",sPrice:"price",sBags:"bags"};
  if(map[t.id]&&scen){const o=$("#"+t.id+"o");const v=Number(t.value);if(o)o.textContent=t.id==="sWeight"?v.toFixed(2)+" kg":t.id==="sPrice"?k(v)+" RWF":t.id==="sBags"?v+" bags":String(v)}
});
$("#lbPrev").onclick=()=>{if(lbIdx>0){lbIdx--;showLB()}};$("#lbNext").onclick=()=>{if(lbIdx<lbList.length-1){lbIdx++;showLB()}};$("#lbClose").onclick=()=>$("#lb").close();
$("#lb").addEventListener("keydown",e=>{if(e.key==="ArrowLeft")$("#lbPrev").click();if(e.key==="ArrowRight")$("#lbNext").click()});
$("#dlg").addEventListener("close",()=>{modalDay=null});
/* tooltip */
const tip=$("#tip");
document.addEventListener("pointermove",e=>{
  const h=e.target.closest&&e.target.closest("[data-tip]");
  if(!h){tip.hidden=true;hideXhair();return}
  tip.innerHTML=h.getAttribute("data-tip");tip.hidden=false;
  const w=tip.offsetWidth,hh=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+hh>innerHeight-8)y=e.clientY-hh-14;
  tip.style.left=Math.max(8,x)+"px";tip.style.top=Math.max(8,y)+"px";
  const cx=h.getAttribute("data-cx");
  if(cx!=null){const g=h.closest("svg")&&h.closest("svg").querySelector(".xhair");
    if(g){if(activeXhair&&activeXhair!==g)activeXhair.setAttribute("visibility","hidden");activeXhair=g;
      const ln=g.querySelector("line");if(ln){ln.setAttribute("x1",cx);ln.setAttribute("x2",cx)}
      const cys=(h.getAttribute("data-cy")||"").split(",").filter(s=>s!=="");
      g.querySelectorAll(".focus").forEach((c,i)=>{if(i<cys.length){c.setAttribute("cx",cx);c.setAttribute("cy",cys[i]);c.setAttribute("visibility","visible")}else c.setAttribute("visibility","hidden")});
      g.setAttribute("visibility","visible");}
  }else hideXhair();
});
document.addEventListener("pointerleave",()=>{tip.hidden=true;hideXhair()});

async function downloadReport(){
  const el=document.getElementById("reportDoc");if(!el)return;
  if(!downloads){toast("Downloads are not available here.");return}
  const c=el.cloneNode(true);c.querySelectorAll("rect.hit").forEach(r=>r.remove());
  for(const img of c.querySelectorAll("img")){try{const r=await fetch(img.getAttribute("src"));const b=await r.blob();img.src=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}catch(e){img.remove()}}
  const css=[...document.querySelectorAll("style")].map(x=>x.textContent).join("\n");
  const name=(S.setup?.farmName||"flock")+" "+(S.setup?.cycleName||"cycle")+" report";
  const html=`<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(name)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>${css}html,body{background:#F2F4EE}body{padding:24px}.report{max-width:960px;margin:0 auto;box-shadow:0 2px 24px rgba(25,32,23,.08)}@media print{html,body{background:#fff}.report{box-shadow:none}}</style></head><body>${c.outerHTML}</body></html>`;
  try{await downloads.save({filename:name.replace(/[^\w-]+/g,"_")+".html",data:html})}catch(err){if(!err||err.code!=="declined")toast("The report could not be downloaded.")}
}
/* ---------- export ---------- */
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
$("#exportBtn").addEventListener("click",async()=>{
  const b=$("#exportBtn");b.disabled=true;b.textContent="Preparing…";
  try{
    const X=await loadXLSX();const M=derive();const wb=X.utils.book_new();
    const add=(name,rows)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows),name);
    const st=M.st;
    add("Setup",[["Item","Value"],["Cycle name",st.cycleName],["Start date",st.startDate],["Chicks bought",M.chicks],["Price per chick (RWF)",num(st.pricePerChick)],["Target sale weight (kg)",num(st.targetWeight)],["Expected sale price (RWF/kg)",M.price],["Other costs (RWF)",M.other],["Coop/equipment share (RWF)",M.coop],["Actual avg weight at sale (kg)",st.actualWeight??""],["Bonus chicks",M.bonus],["Total chicks in flock",M.flock]]);
    add("Daily Log",[["Date","Day #","Birds alive (start)","Deaths","Birds alive (end)","Notes"],...M.days.map(d=>[iso(d.date),d.day,d.startAlive,d.deaths,d.endAlive,d.text]),["TOTALS","","",M.deaths,M.alive,""]]);
    add("Feed Purchases",[["Date","Feed type","Bags","kg per bag","Cost per bag (RWF)","Total (RWF)"],...S.feed.map(f=>[f.date,f.type,num(f.bags),num(f.kgPerBag),num(f.costPerBag),num(f.bags)*num(f.costPerBag)]),["TOTAL","","","","",M.feedCost]]);
    add("Medicine Log",[["Product","Type","What it's for","Cost (RWF)","Dosage / rate","Withdrawal (days)","Date bought","Do not combine with","Notes"],...S.meds.map(m=>[m.name,m.type,m.purpose,num(m.cost),m.dosage,num(m.withdrawal),m.dateBought,m.avoidWith||"",m.notes||""]),["TOTAL","","",M.medCost]]);
    add("Dosing Log",[["First day","Last day","Product","Times per day","Days given","Total doses","Wait (days)","Safe to sell after","Notes"],...M.doses.map(d=>[d.start,d.end||"still giving",d.product,num(d.timesPerDay)||1,d.daysGiven??"",d.total??"",d.wd??"",d.safe!=null?iso(d.safe):"no wait",d.notes||""]),["Latest safe-to-sell date","","","","","","",M.latestSafe!=null?iso(M.latestSafe):"none"]]);
    add("Cycle Summary",[["Item","Value"],["Chicks paid for",M.chicks],["Total chicks in flock",M.flock],["Total deaths",M.deaths],["Birds alive",M.alive],["Mortality rate",+(M.mortality*100).toFixed(2)+"%"],["Chicks cost",M.chickCost],["Feed cost",M.feedCost],["Medicine cost",M.medCost],["Other costs",M.other],["Coop/equipment",M.coop],["TOTAL COST",M.totalCost],["Sale weight (kg)",M.weight],["Price per kg",M.price],["TOTAL REVENUE",M.revenue],["TOTAL PROFIT",M.profit]]);
    add("Materials",[["Item","Category","Kind","Qty","Unit","Cost per unit (RWF)","Total (RWF)","Cycles it lasts","Status","Date bought","Kept","Notes"],...S.materials.map(m=>[m.name,m.category,m.kind,m.qty??"",m.unit||"",m.unitCost??"",M.matCost(m),m.cycles??"",m.status||"",m.dateBought||"",m.where||"",m.notes||""])]);
    add("Expenses",[["Date","Category","What for","Paid to","Amount (RWF)","Notes"],...S.expenses.map(e=>[e.date,e.category,e.text||"",e.paidTo||"",num(e.amount),e.notes||""]),["TOTAL","","","",M.expTotal,""]]);
    add("Sales",[["Date","Buyer","Birds","Live kg","Price per kg","Amount (RWF)","Paid (RWF)","Notes"],...S.sales.map(x=>[x.date,x.buyer||"",num(x.birds),num(x.kg),num(x.pricePerKg),saleAmt(x),num(x.paid),x.notes||""]),["TOTAL","",M.soldBirds,M.soldKg,"",M.salesAmt,M.salesPaid,""]]);
    add("Buyers",[["Name","Phone","Place","Notes"],...S.buyers.map(b=>[b.name,b.phone||"",b.place||"",b.notes||""])]);
    add("Weigh-ins",[["Date","Day","Birds weighed","Total kg","Average kg","Feed left (kg)","FCR"],...M.weighins.map(w=>[w.date,w.day,num(w.birds),num(w.totalKg),+w.avg.toFixed(3),w.feedLeftKg??"",w.fcr?+w.fcr.toFixed(2):""])]);
    add("Vaccinations",[["Day","Disease","Vaccine","How","Status","Date given","Notes"],...M.vax.map(v=>[num(v.day),v.disease,v.vaccine||"",v.route||"",v.status||"",v.dateGiven||"",v.notes||""])]);
    add("Reminders",[["Target date","Reminder","Done","Notes"],...S.todos.map(t=>[t.date||"",t.text,t.done?"yes":"no",t.notes||""])]);
    const buf=X.write(wb,{bookType:"xlsx",type:"array"});
    await downloads.save({filename:(st.cycleName||"cycle").replace(/[^\w-]+/g,"_")+"_flock_ledger.xlsx",data:buf});
  }catch(err){if(!err||err.code!=="declined")toast(err&&err.code?"The download is not available here.":"Could not build the Excel file.")}
  b.disabled=false;b.textContent="Export to Excel";
});

/* ---------- boot ---------- */
render();
(async()=>{
  const claude=window.claude;
  if(!claude||!claude.use){setSync("bad","Records unavailable here");$("#view").innerHTML=`<div class="empty"><h3>Records could not load</h3><p>Open this page in a normal browser window (not private mode) so it can save records.</p></div>`;return}
  const [dbx,user,dlx,asx]=await Promise.all([claude.use("db"),claude.use("user").catch(()=>null),claude.use("downloads").catch(()=>null),claude.use("assets").catch(()=>null)]);
  db=dbx;downloads=dlx;assets=asx;
  if(downloads)$("#exportBtn").hidden=false;
  if(!db){setSync("bad","Records unavailable here");$("#view").innerHTML=`<div class="empty"><h3>Records could not load</h3><p>Open this page in a normal browser window (not private mode) so it can save records.</p></div>`;return}
  if(user){try{const c=await user.can("data.write");canWrite=c!==false;writeUnknown=c===null}catch(_){}}
  setSync("","Syncing");
  const onErr=e=>{setSync("bad",e&&e.code==="revoked"?"Access changed":"Sync stopped")};
  const mark=n=>{L.loaded.add(n);if(L.loaded.size>=16)setSync("ok",window.__storageLabel?window.__storageLabel():window.__assetURL?"Saved on this device":((liveCanWrite??canWrite)===false?"View only":"Saved and synced"));schedule()};
  db.doc("farm/setup").onSnapshot(s=>{L.setup=s.exists?{...s.data()}:null;mark("setup")},onErr);
  db.collection("daily").onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]={...d.data()});L.daily=o;mark("daily")},onErr);
  ["feed","meds","doses","todos","cycles","photos","materials","expenses","sales","buyers","weighins","vaccines","archive"].forEach(c=>db.collection(c).onSnapshot(q=>{L[c]=q.docs.map(d=>({...d.data(),_id:d.id}));mark(c)},onErr));
  db.collection("checks").onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]={...d.data()});L.checks=o;mark("checks")},onErr);
})();
})();
